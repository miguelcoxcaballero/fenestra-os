<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecf7"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="1" stop-color="#1263c4"/>
    </linearGradient>
    <radialGradient id="ring" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="1" stop-color="#b6dcf3"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b3f73" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b3f73" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatar"><circle cx="200" cy="168" r="84"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="200" cy="340" rx="120" ry="16" fill="url(#shadow)"/>
  <rect x="96" y="64" width="208" height="256" rx="22" fill="url(#card)" filter="url(#drop)"/>
  <circle cx="200" cy="168" r="84" fill="url(#ring)"/>
  <g clip-path="url(#avatar)">
    <circle cx="200" cy="146" r="36" fill="url(#person)"/>
    <path d="M128 252c0-44 32-72 72-72s72 28 72 72z" fill="url(#person)"/>
  </g>
  <circle cx="200" cy="168" r="84" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="140" y="270" width="120" height="12" rx="6" fill="#9cc8e8"/>
  <rect x="160" y="292" width="80" height="10" rx="5" fill="#cfe3f2"/>
  <path d="M176 128a30 30 0 0 1 22 -16" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
