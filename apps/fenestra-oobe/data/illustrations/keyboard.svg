        <rect x="64" y="140" width="34" height="30" rx="7"/><rect x="104" y="140" width="34" height="30" rx="7"/>
        <rect x="144" y="140" width="34" height="30" rx="7"/><rect x="184" y="140" width="34" height="30" rx="7"/>
        <rect x="224" y="140" width="34" height="30" rx="7"/><rect x="264" y="140" width="34" height="30" rx="7"/>
        <rect x="304" y="140" width="32" height="30" rx="7"/>
        <rect x="64" y="178" width="48" height="30" rx="7"/><rect x="118" y="178" width="34" height="30" rx="7"/>
        <rect x="198" y="178" width="34" height="30" rx="7"/>
        <rect x="238" y="178" width="34" height="30" rx="7"/><rect x="278" y="178" width="58" height="30" rx="7"/>
        <rect x="64" y="216" width="60" height="30" rx="7"/><rect x="130" y="216" width="34" height="30" rx="7"/>
        <rect x="170" y="216" width="34" height="30" rx="7"/><rect x="250" y="216" width="34" height="30" rx="7"/>
        <rect x="290" y="216" width="46" height="30" rx="7"/>
        <rect x="64" y="254" width="44" height="22" rx="6"/><rect x="290" y="254" width="46" height="22" rx="6"/>
      </g>
      <g fill="url(#key)">
        <rect x="158" y="178" width="34" height="30" rx="7"/>
        <rect x="210" y="216" width="34" height="30" rx="7"/>
        <rect x="114" y="254" width="170" height="22" rx="6"/>
