<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fenestra Paint app icon (original artwork, CC0 / project licence) -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8fff"/>
      <stop offset="0.35" stop-color="#7a5cff"/>
      <stop offset="0.7" stop-color="#ff4f9a"/>
      <stop offset="1" stop-color="#ffa62b"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1b46b"/>
      <stop offset="1" stop-color="#b8692a"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa4b1"/>
      <stop offset="0.5" stop-color="#e8edf3"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="14" y="20" width="92" height="88" rx="14" fill="url(#card)" stroke="#c9d3e0" stroke-width="1.5"
          transform="rotate(-6 60 64)"/>
  </g>
  <path d="M26 82 C 40 52, 58 98, 74 70 S 96 56, 100 74" fill="none" stroke="url(#swoosh)" stroke-width="13"
        stroke-linecap="round"/>
  <circle cx="34" cy="42" r="7" fill="#ffd23f"/>
  <circle cx="52" cy="36" r="5" fill="#25c48a"/>
  <g transform="rotate(42 92 44)">
    <rect x="86" y="2" width="12" height="48" rx="6" fill="url(#handle)"/>
    <rect x="85" y="46" width="14" height="14" rx="2" fill="url(#ferrule)"/>
    <path d="M85 60 h14 c0 10 -3 18 -7 24 c-4 -6 -7 -14 -7 -24z" fill="#1f8fff"/>
    <path d="M89 62 c0 7 1 12 3 17" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
