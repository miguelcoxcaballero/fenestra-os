#
# Fenestra: what "Balanced" means on battery (tuned-ppd maps it here, see packaging/fenestra-shell.spec).
# tuned's balanced-battery (EPP balance_power, turbo kept, panel power savings) plus savings that cost
# no performance on any laptop:
#   - PCIe ASPM powersupersave: L1 substates for NVMe / Wi-Fi / Thunderbolt links while idle
#     (the kernel refuses it where the firmware forbids ASPM; tuned then leaves the policy alone),
#   - no NMI watchdog: one timer interrupt per CPU every 10 s less,
#   - dirty pages written every 15 s instead of 5 s: fewer disk wakeups,
#   - audio codec off after 1 s of silence.
# On AC tuned goes back to "balanced", which restores all of it.
#
[main]
summary=Fenestra: balanced-battery plus ASPM, NMI watchdog, writeback and audio savings
include=balanced-battery

[sysfs]
/sys/module/pcie_aspm/parameters/policy=powersupersave

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=1500

[audio]
timeout=1
