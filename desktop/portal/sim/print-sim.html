<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
  Fenestra Print Studio: the print dialog (desktop/portal/fenestra_portal) rebuilt in HTML with the
  same sizes, colours, strings and logic, next to a digital twin of the printer that behaves as the
  real one (paper path, trays, ink, faults, CUPS options, guided manual two-sided printing).
  Open this file in a browser; nothing is sent anywhere. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenestra Print Studio</title>
<link rel="stylesheet" href="print-sim-dialog.css">
<link rel="stylesheet" href="print-sim-app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="9" rx="2"/><rect x="2" y="11" width="28" height="12" rx="3"/><rect x="8" y="19" width="16" height="10" rx="1.5" class="paper"/><circle cx="25" cy="16" r="1.4" class="led"/></svg>
    <div>
      <div class="brand-name">Fenestra Print Studio</div>
      <div class="brand-sub">Diálogo de impresión y gemelo digital de la impresora</div>
    </div>
  </div>
  <div class="toolbar">
    <label class="field"><span>Documento</span>
      <select id="sim-doc">
        <option value="text">Informe · 5 páginas</option>
        <option value="text7">Apuntes · 7 páginas</option>
        <option value="slides">Presentación horizontal · 4 páginas</option>
        <option value="photo">Foto · 1 página</option>
        <option value="mixed">Folleto en color · 6 páginas</option>
        <option value="none">App sin vista previa (PreparePrint)</option>
        <option value="pdf">Abrir un PDF…</option>
      </select>
    </label>
    <input type="file" id="sim-pdf" accept="application/pdf" hidden>
    <div class="segmented" id="sim-theme" role="group" aria-label="Tema">
      <button data-v="light" class="on">Claro</button><button data-v="dark">Oscuro</button>
    </div>
    <label class="field"><span>Énfasis</span><select id="sim-accent"></select></label>
    <label class="field"><span>Idioma</span>
      <select id="sim-lang"><option value="es">Español</option><option value="en">English</option></select>
    </label>
    <button id="sim-open" class="btn primary"><svg viewBox="0 0 16 16"><path d="M4 1h8v4H4zM1 6h14v6h-3v3H4v-3H1zm4 4v4h6v-4z"/></svg>Imprimir<kbd>Ctrl P</kbd></button>
  </div>
</header>

<main class="workspace">
  <section class="card stage-card">
    <div class="card-head">
      <div><h2>Aplicación</h2><p id="app-sub">El diálogo tal como se ve en Fenestra</p></div>
    </div>
    <div class="stage-fit" id="stage-fit">
      <div class="screen" id="screen">
        <div class="appwin" id="appwin">
          <div class="appwin-title"><span id="app-title">Documento</span></div>
          <div class="appwin-body" id="app-body"></div>
        </div>
        <div class="dlg-holder" id="dlg-holder"></div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
  </section>

  <section class="side">
    <div class="card twin-card">
      <div class="card-head">
        <div><h2>Gemelo digital</h2><p id="ph-model"></p></div>
        <div class="head-right">
          <span class="pill" id="twin-pill">Lista</span>
          <select id="sim-printer" aria-label="Impresora"></select>
        </div>
      </div>
      <div class="twin" id="twin"></div>
    </div>

    <div class="card">
      <nav class="tabs" id="tabs" role="tablist">
        <button data-tab="out" class="on">Salida</button>
        <button data-tab="in">Entrada</button>
        <button data-tab="queue">Cola CUPS</button>
        <button data-tab="ink">Tinta</button>
        <button data-tab="faults">Averías</button>
        <button data-tab="table">Mesa</button>
        <button data-tab="tech">Técnico</button>
        <button data-tab="log">Registro</button>
      </nav>
      <div class="tabpanes">
        <div class="tabpane on" id="tab-out"></div>
        <div class="tabpane" id="tab-in"></div>
        <div class="tabpane" id="tab-queue"></div>
        <div class="tabpane" id="tab-ink"></div>
        <div class="tabpane" id="tab-faults"></div>
        <div class="tabpane" id="tab-table"></div>
        <div class="tabpane" id="tab-tech"></div>
        <div class="tabpane" id="tab-log"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden></div>

<script src="print-sim-data.js"></script>
<script src="print-sim-dialog.js"></script>
<script src="print-sim-printer.js"></script>
<script src="print-sim-art.js"></script>
<script src="print-sim-twin.js"></script>
<script src="print-sim-guide.js"></script>
<script src="print-sim-main.js"></script>
</body>
</html>
