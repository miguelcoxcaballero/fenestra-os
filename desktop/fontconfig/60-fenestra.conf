<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fenestra: Windows font family names resolve to the real Segoe fonts when the
     user imported them from their own Windows (fenestra-import-windows-assets),
     otherwise to Selawik (Microsoft's open, metric-compatible Segoe UI fallback). -->
<fontconfig>
  <alias binding="same"><family>Segoe UI Variable</family><prefer><family>Segoe UI Variable Text</family><family>Segoe UI</family><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Text</family><prefer><family>Segoe UI</family><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Display</family><prefer><family>Segoe UI</family><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable Small</family><prefer><family>Segoe UI</family><family>Selawik</family></prefer></alias>
  <!-- <accept>, not <prefer>: a preferred Selawik went before the real Segoe UI, so every
       Segoe UI / Segoe UI Variable request (GTK, and Qt for names it has no exact match for:
       the shell's "Segoe UI Variable Text") got Selawik even with Windows' fonts imported. -->
  <alias binding="same"><family>Segoe UI</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Fenestra Taskbar Text</family><prefer><family>Segoe UI Variable Small</family><family>Segoe UI</family><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Fenestra UI</family><prefer><family>Segoe UI Variable Text</family><family>Segoe UI</family><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Cascadia Mono</family></prefer></alias>
</fontconfig>
