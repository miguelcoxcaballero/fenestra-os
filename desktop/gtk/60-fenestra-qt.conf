# Fenestra: Qt apps run through XWayland first, so mutter draws Windows 11
# caption buttons (minimize, maximize, close) for them like for every other
# window. Qt's own Wayland decorations cannot be themed. With mutter's native
# XWayland scaling they stay sharp; Wayland is the fallback. Users can override
# QT_QPA_PLATFORM in ~/.config/environment.d/.
QT_QPA_PLATFORM=xcb;wayland
