# Fenestra: keep the compositor responsive when the machine is saturated, so the
# desktop (and the Ctrl+Alt+Del security screen) always reacts, like Windows' DWM.
#
# CPUWeight/IOWeight: cgroup v2 weights (default 100) for gnome-shell inside
# session.slice. uresourced already gives session.slice 500 vs app.slice 100;
# this makes the Shell win against the other session services too (gsd-*,
# pipewire, tracker...), i.e. ~10x their CPU/IO share under contention. It does
# nothing while the machine is idle.
#
# Nice= is deliberately not set: the systemd user manager has RLIMIT_NICE=0 and
# cannot lower a nice value; a negative Nice= would make the Shell fail to start.
# Frame timing is covered by mutter 49 itself: its KMS thread already gets
# realtime/high priority from rtkit by default (the old 'rt-scheduler'
# experimental feature was folded into that and no longer exists).
[Service]
CPUWeight=1000
IOWeight=1000
