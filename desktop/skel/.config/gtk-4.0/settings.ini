[Settings]
# Fallbacks for GTK 4 when no settings daemon/portal answers (X11 frames,
# X11 apps, other sessions). Under GNOME the dconf values win.
gtk-application-prefer-dark-theme=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=Bibata-Original-Classic
gtk-cursor-theme-size=32
gtk-decoration-layout=appmenu:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Segoe UI Variable Text 10
gtk-icon-theme-name=Fenestra
gtk-primary-button-warps-slider=true
gtk-theme-name=Fenestra-Dark
