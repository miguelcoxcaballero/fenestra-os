# xdg-desktop-portal-kde serves ScreenCast, Screenshot, RemoteDesktop, GlobalShortcuts and
# InputCapture only when XDG_CURRENT_DESKTOP is "KDE". Under Fenestra (KWin + Fenestra Shell)
# it hid them, so screen sharing (browsers, video calls) and wireless displays could not start.
# This sets the name for this one process; the session keeps "Fenestra", and
# fenestra-portals.conf still decides which backend answers each portal.
[Service]
Environment=XDG_CURRENT_DESKTOP=KDE
