# Fenestra's chrony settings, on top of Fedora's own (chronyd runs with this file:
# session/system/chronyd.service.d/fenestra.conf).
include /etc/chrony.conf

# Correct a wrong clock at once, as Windows does, not only in the first three updates after
# chronyd starts. With Fedora's "makestep 1.0 3", a clock found an hour off after waking from
# suspend (seen on a laptop whose RTC keeps local time for Windows) was slewed instead:
# at chrony's top rate that takes some 12 hours, and the taskbar showed the wrong time all along.
makestep 1.0 -1
