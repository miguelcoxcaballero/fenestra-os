# xdg-desktop-portal backends for the GNOME session on Fenestra (installed to
# /etc/xdg-desktop-portal/, which overrides GNOME's own gnome-portals.conf). Same as GNOME's
# defaults, plus Fenestra's print dialog (xdg-desktop-portal-fenestra); file dialogs stay with
# gnome, which hands them to Files (Nautilus) with the Explorer layer.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
org.freedesktop.impl.portal.Print=fenestra;gnome;
