# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=Fenestra (KWin + Fenestra Shell).
# gtk keeps GTK apps' file chooser and reads appearance from gsettings (Fenestra Settings mirrors
# the shell's colour scheme and accent there); kde talks to KWin for capture and shortcuts.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.Screenshot=kde
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.GlobalShortcuts=kde
org.freedesktop.impl.portal.InputCapture=kde
org.freedesktop.impl.portal.Inhibit=kde
org.freedesktop.impl.portal.Secret=gnome-keyring
