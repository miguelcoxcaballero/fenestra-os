# Fenestra installer settings (loaded after the Fedora profile).
[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/fenestra/fenestra.css
# The account is created by the Fenestra first-boot setup, and root stays
# locked (kickstart "rootpw --lock"), so these spokes are not shown.
hidden_spokes =
    UserSpoke
    PasswordSpoke

[Bootloader]
menu_auto_hide = True
