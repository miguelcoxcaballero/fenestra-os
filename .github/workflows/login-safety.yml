name: login-safety
# The login screen must never be broken by a Fenestra extension (Fedora 45 black screen):
# removed-API linter, module syntax, and the headless greeter / lock-screen bench.
on:
  push:
    branches: [main, 'fix/**', 'wip/**']
  pull_request:
    paths:
      - 'desktop/extensions/**'
      - 'extras/fedora-upgrade/system-extensions/**'
      - 'extras/compat/**'
      - 'extras/fedora-upgrade/*.sh'
      - 'desktop/libexec/fenestra-login-guard'
      - 'desktop/libexec/fenestra-release-upgrade*'
      - 'tests/greeter/**'
      - 'tools/lint-shell-extensions.py'
      - 'tools/check-js-syntax.js'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Removed / changed GNOME Shell APIs
        run: python3 tools/lint-shell-extensions.py
      - name: Compatibility matrix is valid JSON
        run: python3 -m json.tool extras/compat/login-extensions.json > /dev/null
      - name: Scripts
        run: |
          for f in extras/fedora-upgrade/*.sh tests/greeter/*.sh desktop/libexec/fenestra-release-upgrade-user; do bash -n "$f"; done
          python3 -m py_compile desktop/libexec/fenestra-login-guard desktop/libexec/fenestra-release-upgrade tests/greeter/fakelogind.py

  syntax:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Module syntax with gjs
        run: |
          dnf -y -q install gjs findutils
          find desktop/extensions extras/fedora-upgrade/system-extensions -name '*.js' \
               -not -path '*/ding@rastersoft.com/app/*' -print0 | xargs -0 gjs -m tools/check-js-syntax.js

  greeter-bench:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        fedora: ['45']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the bench extracts the pre-fix versions from history
      - name: Image (Fedora ${{ matrix.fedora }})
        run: docker build --build-arg FEDORA=${{ matrix.fedora }} -t fenestra-greeterlab -f tests/greeter/Containerfile tests/greeter
      - name: Greeter and lock-screen bench
        run: OUT=$RUNNER_TEMP/bench bash tests/greeter/bench.sh fenestra-greeterlab
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greeter-bench-f${{ matrix.fedora }}
          path: ${{ runner.temp }}/bench
